<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MyWorkspace — Tech Support</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,600;1,400&family=Source+Sans+3:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0d0d0f;--bg2:#141416;--bg3:#1a1a1e;--bg4:#222226;
  --border:#252528;--border2:#333338;
  --text:#e8e8ec;--text2:#7a7a8a;--text3:#44444e;
  --blue:#c8a97e;--blue-dim:rgba(200,169,126,.1);--blue-glow:rgba(200,169,126,.18);
  --green:#4a9e6b;--green-dim:rgba(74,158,107,.1);
  --amber:#c8a97e;--amber-dim:rgba(200,169,126,.1);
  --red:#c0392b;--red-dim:rgba(192,57,43,.12);
  --purple:#8b7fb8;--purple-dim:rgba(139,127,184,.1);
  --r:6px;--rs:4px;--rl:8px;
  --font:'Source Sans 3','Segoe UI',sans-serif;--serif:'Lora',Georgia,serif;--mono:'JetBrains Mono','Fira Mono',monospace;
}
body.light{
  --bg:#f5f4f2;--bg2:#ffffff;--bg3:#efeeec;--bg4:#e5e4e0;
  --border:#dddbd6;--border2:#cbc9c3;
  --text:#1a1a18;--text2:#5a5a52;--text3:#9a9a90;
  --blue:#8b6914;--blue-dim:rgba(139,105,20,.1);--blue-glow:rgba(139,105,20,.18);
  --green:#2d6e49;--green-dim:rgba(45,110,73,.08);
  --amber:#8b6914;--amber-dim:rgba(139,105,20,.08);
  --red:#a82318;--red-dim:rgba(168,35,24,.08);
  --purple:#5f5494;--purple-dim:rgba(95,84,148,.08);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{font-family:var(--font);background:var(--bg);color:var(--text);font-size:14px;-webkit-font-smoothing:antialiased;letter-spacing:.01em}
.shell{display:grid;grid-template-columns:220px 1fr;grid-template-rows:52px 1fr;height:100vh;transition:grid-template-columns .22s ease}

/* TOPBAR */
.topbar{grid-column:1/-1;background:var(--bg2);border-bottom:1px solid var(--border2);display:flex;align-items:center;justify-content:space-between;padding:0 20px;z-index:10;height:52px}
.logo{display:flex;align-items:center;gap:10px}
.logo-icon{width:30px;height:30px;background:var(--blue);border-radius:8px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.logo-icon svg{width:17px;height:17px;stroke:#fff;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.logo-name{font-size:15px;font-weight:700;font-family:var(--font);letter-spacing:.12em;line-height:1;text-transform:uppercase}
.logo-sub{font-size:9px;color:var(--text3);font-family:var(--mono);margin-top:2px;letter-spacing:.14em;text-transform:uppercase}
  100%{background-position:300% center}
}
  50%{transform:scale(1.6);opacity:.4;box-shadow:0 0 16px #c4b5fd}
}
  50%{transform:scale(1.5);opacity:.5;box-shadow:0 0 14px #a78bfa}
}
.topbar-r{display:flex;align-items:center;gap:16px}
.live{display:flex;align-items:center;gap:6px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--green);animation:pulse 2.5s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.sm-txt{font-size:11px;color:var(--text3);font-family:var(--mono)}
#clock{font-size:12px;color:var(--text2);font-family:var(--mono);letter-spacing:.04em}

/* SIDEBAR */
.sidebar{background:var(--bg2);border-right:1px solid var(--border2);padding:14px 10px;display:flex;flex-direction:column;overflow-y:auto;overflow-x:hidden;transition:padding .22s ease}
.sidebar.collapsed{padding:14px 6px}
.shell.collapsed{grid-template-columns:48px 1fr}
.sidebar-text{transition:opacity .18s ease,width .18s ease}
.shell.collapsed .sidebar-text{opacity:0;width:0;overflow:hidden;display:inline-block}
.shell.collapsed .nav-sec{opacity:0;height:0;padding:0;overflow:hidden}
.shell.collapsed .nav-spacer{display:none}
.shell.collapsed .sf{padding-top:6px}
.shell.collapsed .sf>div:first-child{display:none}
.shell.collapsed #save-file-btn span,.shell.collapsed .eb span{display:none}
.shell.collapsed .ni{justify-content:center;padding:10px 6px}
.shell.collapsed .ni svg{margin:0}
.shell.collapsed .eb{justify-content:center;padding:8px 6px}
.shell.collapsed #sidebar-toggle{justify-content:center;padding:7px 6px}
.shell-toggle{width:28px;height:28px;border-radius:var(--rs);border:1px solid var(--border2);background:transparent;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--text2);transition:all .15s;flex-shrink:0}
.shell-toggle:hover{background:var(--bg3);color:var(--text)}
.shell-toggle svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;transition:transform .22s}
.nav-sec{font-size:9px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.18em;padding:14px 10px 4px;font-family:var(--mono)}
.nav-sec:first-child{padding-top:4px}
.ni{display:flex;align-items:center;gap:9px;padding:9px 10px;border-radius:var(--r);cursor:pointer;font-size:12px;font-weight:400;color:var(--text2);border:none;background:transparent;width:100%;text-align:left;font-family:var(--font);transition:all .13s;position:relative;letter-spacing:.04em}
.ni svg{width:14px;height:14px;flex-shrink:0;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;opacity:.7;transition:opacity .13s}
.ni:hover{background:var(--bg3);color:var(--text)}
.ni:hover svg{opacity:1}
.ni.active{background:var(--blue-dim);color:var(--blue);font-weight:600;letter-spacing:.04em}
.ni.active svg{opacity:1}
.ni.active::before{content:'';position:absolute;left:0;top:3px;bottom:3px;width:2px;background:var(--blue);border-radius:0 1px 1px 0}
.nav-spacer{flex:1}
.sf{margin-top:8px;padding-top:8px;border-top:1px solid var(--border)}
.eb{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:var(--rs);cursor:pointer;font-size:12px;color:var(--text3);border:1px solid var(--border);background:transparent;width:100%;text-align:left;font-family:var(--font);transition:all .13s}
.eb:hover{background:var(--bg3);color:var(--text2);border-color:var(--border2)}
.eb svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* MAIN */
.main{overflow-y:auto;padding:20px 22px;display:flex;flex-direction:column;gap:14px;background:var(--bg)}
.page{display:none;flex-direction:column;gap:18px;animation:fi .2s ease}
.page.active{display:flex}
@keyframes fi{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}

/* KPI */
.kpi-row{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.kpi{background:var(--bg3);border:1px solid var(--border);border-radius:var(--rl);padding:14px 16px;position:relative;overflow:hidden;transition:border-color .2s,transform .15s;cursor:default}
.kpi:hover{border-color:var(--border2);transform:translateY(-1px)}
.kpi-stripe{position:absolute;top:0;left:0;width:2px;top:0;bottom:0;height:auto}
.kpi-lbl{font-size:9px;color:var(--text3);font-weight:600;text-transform:uppercase;letter-spacing:.12em;margin-bottom:6px;font-family:var(--mono)}
.kpi-val{font-size:26px;font-weight:300;letter-spacing:-.01em;line-height:1;font-family:var(--mono)}
.kpi-sub{font-size:10px;color:var(--text3);margin-top:4px;font-family:var(--mono);letter-spacing:.04em}

/* PANEL */
.panel{background:var(--bg2);border:1px solid var(--border2);border-radius:var(--rl);overflow:hidden}
.ph{padding:11px 16px;border-bottom:1px solid var(--border2);display:flex;align-items:center;justify-content:space-between;gap:10px}
.pt{font-size:11px;font-weight:600;color:var(--text2);font-family:var(--mono);letter-spacing:.1em;text-transform:uppercase}
.pb{padding:18px}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:16px}

/* FIELDS */
.field{margin-bottom:13px}
.field:last-child{margin-bottom:0}
.field label{display:block;font-size:9px;font-weight:600;color:var(--text3);margin-bottom:6px;letter-spacing:.14em;text-transform:uppercase;font-family:var(--mono)}
input[type=text],input[type=number],input[type=email],select,textarea{
  width:100%;font-size:13px;color:var(--text);background:var(--bg3);
  border:1px solid var(--border2);border-radius:var(--r);
  padding:9px 12px;outline:none;font-family:var(--font);letter-spacing:.01em;
  transition:border-color .15s,background .15s
}
input:focus,select:focus,textarea:focus{border-color:var(--blue);background:var(--bg4);box-shadow:0 0 0 3px var(--blue-glow)}
input::placeholder,textarea::placeholder{color:var(--text3)}
textarea{resize:vertical;line-height:1.65;min-height:110px}
select option{background:var(--bg3);color:var(--text)}

/* TOGGLE */
.toggle-row{display:flex;gap:6px}
.tog{flex:1;padding:9px 6px;border:1px solid var(--border2);border-radius:20px;background:transparent;font-size:12px;font-weight:500;color:var(--text2);cursor:pointer;font-family:var(--font);text-align:center;transition:all .13s}
.tog:hover{border-color:var(--border2);color:var(--text)}
.tog.phone{background:var(--blue-dim);color:var(--blue);border-color:var(--blue)}
.tog.email{background:var(--amber-dim);color:var(--amber);border-color:var(--amber)}

/* AC */
.ac-wrap{position:relative}
.ac-drop{display:none;position:absolute;top:calc(100% + 4px);left:0;right:0;border:1px solid var(--border2);border-radius:var(--rs);background:var(--bg3);max-height:200px;overflow-y:auto;z-index:500;box-shadow:0 10px 32px rgba(0,0,0,.55)}
.ac-drop.open{display:block}
.ac-item{padding:9px 12px;font-size:13px;cursor:pointer;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;transition:background .1s}
.ac-item:last-child{border-bottom:none}
.ac-item:hover{background:var(--bg4)}
.ac-item:hover .ac-text{color:var(--blue)}
.ac-text{font-size:13px;color:var(--text)}
.ac-meta{font-size:11px;color:var(--text3);font-family:var(--mono)}
.ac-sub{font-size:11px;color:var(--text3);margin-top:2px}
mark{background:none;font-weight:600;color:var(--blue)}
.freq-bar{height:2px;border-radius:1px;background:var(--blue);opacity:.35;margin-top:4px}

/* CHIPS */
.chip-row{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px}
.chip{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:20px;background:var(--bg4);border:1px solid var(--border2);font-size:11px;cursor:pointer;color:var(--text2);transition:all .12s}
.chip:hover{background:var(--red-dim);border-color:var(--red);color:var(--red)}

/* INLINE ADD */
.inline-add{display:flex;gap:6px;margin-top:8px}
.inline-add input{flex:1;font-size:12px;padding:7px 10px}

/* OUT BOX */
.out-box{background:#0a0a0c;border:1px solid var(--border2);border-radius:var(--rs);padding:14px 16px;font-size:12px;font-family:var(--mono);color:#a0c8a0;line-height:1.8;min-height:60px;word-break:break-all;letter-spacing:.02em}

/* BUTTONS */
.btn-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.btn{font-size:11px;font-weight:500;letter-spacing:.04em;padding:7px 16px;border-radius:20px;cursor:pointer;border:1px solid var(--border2);background:transparent;color:var(--text2);font-family:var(--font);transition:all .12s;display:inline-flex;align-items:center;gap:6px}
.btn svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.btn:hover{background:var(--bg3);border-color:var(--border2);color:var(--text)}
.btn:active{transform:scale(.97)}
.btn-p{background:var(--blue);color:#0d0d0f;border-color:var(--blue);font-weight:600}
.btn-p:hover{opacity:.88;background:var(--blue)}
.btn-s{background:var(--green-dim);color:var(--green);border-color:rgba(62,207,142,.3)}
.btn-s:hover{opacity:.85;background:var(--green-dim)}
.btn-d{background:var(--red-dim);color:var(--red);border-color:rgba(240,78,78,.3)}
.btn-d:hover{opacity:.85;background:var(--red-dim)}
.btn-sm{font-size:11px;padding:5px 11px}

/* TOAST */
.toast{position:fixed;top:18px;left:50%;transform:translateX(-50%);z-index:9999;display:none;padding:9px 20px;border-radius:20px;font-size:12px;font-weight:500;white-space:nowrap;font-family:var(--font)}
.tok{background:var(--green-dim);color:var(--green);border:1px solid rgba(62,207,142,.3)}
.terr{background:var(--red-dim);color:var(--red);border:1px solid rgba(240,78,78,.3)}

/* AF NOTE */

/* TABLE */
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:12px}
th{background:var(--bg3);color:var(--text3);font-weight:500;padding:9px 12px;text-align:left;border-bottom:1px solid var(--border);font-size:10px;text-transform:uppercase;letter-spacing:.07em;white-space:nowrap}
td{padding:10px 12px;border-bottom:1px solid var(--border);vertical-align:middle;color:var(--text2)}
tr:last-child td{border-bottom:none}
tr:hover td{background:var(--bg3);color:var(--text)}

/* BADGE */
.badge{display:inline-block;font-size:10px;padding:3px 9px;border-radius:20px;font-weight:500;font-family:var(--mono);white-space:nowrap;letter-spacing:.04em}
.bb{background:var(--blue-dim);color:var(--blue);border:1px solid rgba(79,142,247,.2)}
.ba{background:var(--amber-dim);color:var(--amber);border:1px solid rgba(245,158,11,.2)}
.bg{background:var(--green-dim);color:var(--green);border:1px solid rgba(62,207,142,.2)}
.bp{background:var(--purple-dim);color:var(--purple);border:1px solid rgba(167,139,250,.2)}

/* AVATAR */
.av{width:30px;height:30px;border-radius:50%;background:var(--blue-dim);border:1px solid var(--border2);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;color:var(--blue);flex-shrink:0;font-family:var(--mono)}

/* DB ROW */
.db-row{display:flex;align-items:center;justify-content:space-between;padding:9px 12px;border-radius:var(--r);border:1px solid var(--border);margin-bottom:6px;background:var(--bg3);transition:border-color .15s}
.db-row:hover{border-color:var(--border2)}
.db-row:last-child{margin-bottom:0}

/* BARS */
.bar-wrap{display:flex;align-items:center;gap:10px;margin-bottom:9px}
.bar-label{font-size:12px;color:var(--text2);width:155px;flex-shrink:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar-track{flex:1;height:6px;background:var(--bg4);border-radius:3px;overflow:hidden}
.bar-fill{height:100%;border-radius:3px;background:var(--blue);opacity:.65;transition:width .5s ease}
.bar-count{font-size:11px;color:var(--text3);font-family:var(--mono);width:22px;text-align:right}

/* PILLS */
.pill-group{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:12px}
.pill{padding:4px 12px;border-radius:20px;border:1px solid var(--border);font-size:11px;cursor:pointer;background:transparent;color:var(--text3);font-family:var(--font);transition:all .13s}
.pill:hover{border-color:var(--border2);color:var(--text2)}
.pill.on{background:var(--blue-dim);border-color:rgba(79,142,247,.3);color:var(--blue)}

.mic-btn{display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border-radius:20px;border:1px solid var(--border2);background:transparent;font-size:11px;font-weight:500;color:var(--text2);cursor:pointer;font-family:var(--font);transition:all .15s}
.mic-btn:hover{border-color:var(--border2);color:var(--text);background:var(--bg3)}
.fix-btn{display:inline-flex;align-items:center;gap:5px;padding:5px 12px;border-radius:20px;border:1px solid var(--border2);background:transparent;font-size:11px;font-weight:500;color:var(--text2);cursor:pointer;font-family:var(--font);transition:all .15s;margin-left:5px}
.fix-btn:hover{border-color:var(--green);color:var(--green);background:var(--green-dim)}
.fix-btn svg{width:12px;height:12px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.fix-btn.done{border-color:var(--green);color:var(--green);background:var(--green-dim)}
.mic-btn.listening{background:var(--red-dim);border-color:var(--red);color:var(--red);animation:mic-pulse 1.2s ease-in-out infinite}
.mic-btn svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
@keyframes mic-pulse{0%,100%{opacity:1}50%{opacity:.5}}
.field-label-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.field-label-row label{margin-bottom:0}
.shortcut-hint{font-size:10px;color:var(--text3);font-family:var(--mono);letter-spacing:.04em}

hr{border:none;border-top:1px solid var(--border);margin:14px 0}
.cust-tab{padding:7px 16px;border-radius:20px;border:1px solid var(--border);background:transparent;font-size:12px;font-weight:500;cursor:pointer;font-family:var(--font);color:var(--text2);transition:all .13s}
.cust-tab:hover{background:var(--bg3);color:var(--text)}
.cust-tab.active{background:var(--blue-dim);color:var(--blue);border-color:rgba(79,142,247,.35)}
.cust-cat-block{background:var(--bg3);border:1px solid var(--border);border-radius:var(--r);margin-bottom:12px;overflow:hidden}
.cust-cat-hdr{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;cursor:pointer;gap:10px}
.cust-cat-hdr:hover{background:var(--bg4)}
.cust-cat-title{font-size:13px;font-weight:600;letter-spacing:.02em}
.cust-cat-body{padding:10px 14px;border-top:1px solid var(--border);display:none}
.cust-cat-body.open{display:block}
.cust-btn-grid{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.cust-btn-item{display:inline-flex;align-items:center;gap:4px;padding:5px 11px;border-radius:20px;border:1px solid var(--border2);background:var(--bg4);font-size:12px;color:var(--text)}
.cust-btn-del{background:none;border:none;cursor:pointer;font-size:14px;color:var(--text3);padding:0;line-height:1;transition:color .12s}
.cust-btn-del:hover{color:var(--red)}
.cust-add-btn-row{display:flex;gap:6px;margin-top:6px}
.cust-add-btn-row input{flex:1;font-size:12px;padding:6px 10px}
/* STICKY NOTES */
.sn-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px;padding:20px 24px}
.sn-add-bar{display:flex;gap:10px;align-items:flex-start;padding:20px 24px 0}
.sn-add-bar textarea{flex:1;min-height:80px;resize:vertical;font-family:var(--font);font-size:14px;line-height:1.6}
.sn-add-btn{padding:10px 18px;border-radius:var(--rs);border:1px solid var(--border2);background:transparent;color:var(--text2);font-size:13px;font-weight:500;cursor:pointer;font-family:var(--font);transition:all .13s;white-space:nowrap}
.sn-add-btn:hover{background:var(--bg3);color:var(--text)}
.sn-card{border-radius:var(--r);padding:14px 16px;min-height:100px;position:relative;display:flex;flex-direction:column;gap:8px;transition:transform .15s,border-color .15s}
.sn-card:hover{transform:translateY(-2px)}
.sn-card:hover .sn-del{opacity:1}
.sn-body{font-family:var(--font);font-size:13px;line-height:1.65;color:inherit;word-break:break-word;flex:1;white-space:pre-wrap;outline:none;cursor:text;border-radius:4px}
.sn-body:focus{background:rgba(255,255,255,.06)}
.sn-meta{font-size:10px;opacity:.55;font-family:var(--mono);letter-spacing:.04em}
.sn-del{position:absolute;top:8px;right:8px;width:20px;height:20px;border-radius:50%;border:none;background:rgba(0,0,0,.25);color:inherit;font-size:13px;cursor:pointer;display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity .15s,background .13s;line-height:1}
.sn-del:hover{background:rgba(0,0,0,.45)}
.sn-empty{padding:48px 24px;text-align:center;color:var(--text3);font-size:14px}
.sn-color-row{display:flex;gap:6px;align-items:center}
.sn-dot{width:18px;height:18px;border-radius:50%;cursor:pointer;border:2px solid transparent;transition:transform .13s,border-color .13s;flex-shrink:0}
.sn-dot:hover{transform:scale(1.15)}
.sn-dot.sel{border-color:rgba(255,255,255,.5)}
.mdot{width:7px;height:7px;border-radius:50%;display:inline-block;margin-right:5px}
.mp{background:var(--blue)}
.me{background:var(--amber)}
.sr-row{display:flex;gap:8px;margin-bottom:14px;align-items:center}
.sr-row input{flex:1}


/* FLOATING CATEGORY BUTTONS */
.fcat-wrap{margin-top:10px}
.fcat-row{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px}
.fcat-toggle{display:inline-flex;align-items:center;gap:6px;padding:6px 13px 6px 10px;border-radius:20px;border:1.5px solid;font-size:11px;font-weight:500;cursor:pointer;font-family:var(--font);transition:all .15s;letter-spacing:.03em;position:relative}
.fcat-toggle svg{width:11px;height:11px;stroke:currentColor;fill:none;stroke-width:2.5;stroke-linecap:round;transition:transform .2s;flex-shrink:0}
.fcat-toggle.open svg{transform:rotate(45deg)}
.fcat-btns{display:none;flex-wrap:wrap;gap:5px;margin-bottom:8px;padding:10px 12px;border-radius:var(--rs);border:1px solid var(--border);align-items:center}
.fcat-btns.open{display:flex}
.fb{padding:5px 13px;border-radius:20px;border:1px solid;font-size:11px;font-weight:500;cursor:pointer;font-family:var(--font);transition:all .13s;white-space:nowrap;letter-spacing:.02em}
.fb:active{transform:scale(.95)}
.fb-del{padding:3px 7px;border-radius:20px;border:none;background:transparent;font-size:13px;cursor:pointer;color:var(--text3);transition:all .13s;line-height:1;opacity:0;margin-left:-4px}
.fcat-btns:hover .fb-del{opacity:.5}
.fb-del:hover{opacity:1!important;color:var(--red)}
.fcat-add-row{display:flex;gap:5px;align-items:center;margin-top:4px;width:100%}
.fcat-add-row input{font-size:11px;padding:4px 9px;border-radius:20px;border:1px dashed var(--border2);background:var(--bg4);color:var(--text2);font-family:var(--font);outline:none;width:160px;transition:border-color .15s}
.fcat-add-row input:focus{border-color:var(--border2);border-style:solid}
.fcat-add-row button{padding:4px 10px;border-radius:20px;font-size:11px;font-weight:500;cursor:pointer;font-family:var(--font);border:1px solid var(--border2);background:var(--bg3);color:var(--text2);transition:all .13s}
.fcat-add-row button:hover{background:var(--bg4);color:var(--text)}
.add-cat-row{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:6px;padding:8px 10px;background:var(--bg3);border-radius:var(--rs);border:1px dashed var(--border2)}
.add-cat-row input{font-size:11px;padding:5px 10px;border-radius:20px;border:1px solid var(--border);background:var(--bg4);color:var(--text2);font-family:var(--font);outline:none}
.add-cat-row input:focus{border-color:var(--border2)}
.add-cat-row select{font-size:11px;padding:5px 8px;border-radius:20px;border:1px solid var(--border);background:var(--bg4);color:var(--text2);font-family:var(--font);outline:none;cursor:pointer}
.add-cat-row button{padding:5px 13px;border-radius:20px;font-size:11px;font-weight:600;cursor:pointer;font-family:var(--font);border:1px solid var(--border2);background:var(--bg3);color:var(--text);transition:all .13s}
.add-cat-row button:hover{background:var(--bg4)}
.add-cat-lbl{font-size:10px;color:var(--text3);font-weight:500;text-transform:uppercase;letter-spacing:.07em}

::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:var(--text3)}
</style>

<div class="shell">

<!-- MAIN -->
<div class="main">

<!-- NEW TICKET -->

                Fix

  </div>
</div>

function getRawSaveData(){
  try{
    const src=document.documentElement.outerHTML;
    const m=src.match(/===SAVEDATA===([\s\S]*?)===SAVEDATA===/);
    if(m)return JSON.parse(m[1].trim());
  }catch(e){}
  return {sig:'DhruvkumarPMTLCTWS',notes:[],stickies:[],fcats:null,db:null};
}

function getSIG(){return LIVE.sig||getRawSaveData().sig||'DhruvkumarPMTLCTWS';}
function setSIG(v){

}

function load(){
  const saved=getRawSaveData();

function save(){
  LIVE.db=DB;
  markUnsaved();
}

// In-memory working copy of all persistent data
const LIVE={sig:null,notes:null,fcats:null,stickies:null,db:null,unsaved:false};
(function initLive(){
  const d=getRawSaveData();

function loadFcats(){
  if(LIVE.fcats&&Object.keys(LIVE.fcats).length>0)return LIVE.fcats;
  try{const r=localStorage.getItem('tt_fcats');if(r){const p=JSON.parse(r);LIVE.fcats=p;return p;}}catch(e){}
  const def=JSON.parse(JSON.stringify(FCAT_DEFAULTS));
  LIVE.fcats=def;
  return def;
}
function saveFcats(data){
  LIVE.fcats=data;
  try{localStorage.setItem('tt_fcats',JSON.stringify(data));}catch(e){}
  markUnsaved();
}

// ── RENDER FCAT PANELS ────────────────────────────────────────────────────
function renderFcats(scope,containerId,targetFieldId){
  const el=document.getElementById(containerId);
  if(!el)return;
  const data=loadFcats();
  const cats=data[scope]||[];
  let html='<div class="fcat-row" style="margin-bottom:6px">';
  cats.forEach((cat,ci)=>{
    const c=FCAT_COLORS[cat.color]||FCAT_COLORS.blue;
    html+=`<button class="fcat-toggle" id="ftog-${scope}-${ci}"
      style="background:${c.bg};border-color:${c.border};color:${c.text}"
      onclick="toggleFcatDyn('${scope}',${ci},'${containerId}')">
      <svg viewBox="0 0 10 10"><path d="M3 5h4M5 3v4"/></svg>${cat.label}
    </button>`;
  });
  html+='</div>';
  cats.forEach((cat,ci)=>{
    const c=FCAT_COLORS[cat.color]||FCAT_COLORS.blue;
    html+=`<div class="fcat-btns" id="fpanel-${scope}-${ci}" style="background:${c.fbg};border-color:${c.fborder}">`;
    cat.items.forEach((item,ii)=>{
      const safe=item.replace(/\\/g,'\\\\').replace(/'/g,"\\'");
      html+=`<button class="fb" style="background:${c.fbg};border-color:${c.fborder};color:${c.ftext}" onclick="insertFb('${targetFieldId}','${safe}')">${item}</button><button class="fb-del" onclick="deleteBtn('${scope}',${ci},${ii})" title="Remove">×</button>`;
    });
    html+=`<div class="fcat-add-row">
      <input type="text" id="fcat-addinput-${scope}-${ci}" placeholder="Add button text..." onkeydown="if(event.key==='Enter')addBtn('${scope}',${ci},'${targetFieldId}')">
      <button onclick="addBtn('${scope}',${ci},'${targetFieldId}')" style="border-color:${c.fborder};color:${c.ftext}">+ Add</button>
    </div></div>`;
  });
  el.innerHTML=html;
}

function toggleFcatDyn(scope,ci,containerId){
  const panel=document.getElementById('fpanel-'+scope+'-'+ci);
  const btn=document.getElementById('ftog-'+scope+'-'+ci);
  if(!panel||!btn)return;
  const isOpen=panel.classList.contains('open');
  // close all in this container
  document.querySelectorAll('[id^="fpanel-'+scope+'-"]').forEach(p=>p.classList.remove('open'));
  document.querySelectorAll('[id^="ftog-'+scope+'-"]').forEach(b=>b.classList.remove('open'));
  if(!isOpen){panel.classList.add('open');btn.classList.add('open');}
}

function addBtn(scope,ci,targetId){
  const inp=document.getElementById('fcat-addinput-'+scope+'-'+ci);
  if(!inp||!inp.value.trim())return;
  const data=loadFcats();
  data[scope][ci].items.push(inp.value.trim());
  saveFcats(data);
  renderAllFcats();
  // reopen the panel
  setTimeout(()=>{
    document.querySelectorAll('[id^="fpanel-'+scope+'-"]').forEach(p=>p.classList.remove('open'));
    document.querySelectorAll('[id^="ftog-'+scope+'-"]').forEach(b=>b.classList.remove('open'));
    const p=document.getElementById('fpanel-'+scope+'-'+ci);
    const b=document.getElementById('ftog-'+scope+'-'+ci);
    if(p)p.classList.add('open');if(b)b.classList.add('open');
  },50);
  toast('Button added');
}

function deleteBtn(scope,ci,ii){
  const data=loadFcats();
  data[scope][ci].items.splice(ii,1);
  saveFcats(data);
  renderAllFcats();
}

function addCategory(scope){
  const nameInputId=scope+'-new-cat-name'||'prev-new-cat-name';
  const colorInputId=scope+'-new-cat-color';
  const nameEl=document.getElementById(nameInputId);
  const colorEl=document.getElementById(colorInputId);
  if(!nameEl||!nameEl.value.trim()){toast('Enter a category name','err');return;}
  const data=loadFcats();
  if(!data[scope])data[scope]=[];
  const newId=scope+'-cat-'+Date.now();
  data[scope].push({id:newId,label:nameEl.value.trim(),color:colorEl?colorEl.value:'blue',items:[]});

}

}

function insertFb(targetId, text){
  const el=document.getElementById(targetId);
  if(!el)return;
  const cur=el.value;
  const trimmed=cur.trimEnd();
  let sep='';
  if(trimmed.length>0){
    const last=trimmed[trimmed.length-1];
    if(last!==','&&last!==';'&&last!=='\n') sep=', ';
    else sep=' ';
  }
  el.value=trimmed+sep+text;
  el.focus();
  el.setSelectionRange(el.value.length,el.value.length);
  el.scrollTop=el.scrollHeight;
}

function saveToFile(){
  // Build the updated savedata block
  const saveData={
    sig:LIVE.sig||getSIG(),
    notes:LIVE.notes||loadNotes(),
    stickies:[],
    fcats:LIVE.fcats||loadFcats(),
    db:LIVE.db||DB
  };
  const json=JSON.stringify(saveData,null,2);
  const newBlock='/* ===SAVEDATA===\n'+json+'\n===SAVEDATA=== */';

  // Get current file source and replace the savedata block
  const src=document.documentElement.outerHTML;
  const updated=src.replace(/\/\* ===SAVEDATA===([\s\S]*?)===SAVEDATA=== \*\//,newBlock);

  // Download the updated file
  const blob=new Blob([updated],{type:'text/html'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='ticket-tracker.html';
  a.click();
  URL.revokeObjectURL(a.href);
  markSaved();
  toast('File saved — replace your old file with the downloaded one');
}

function hl(t,q){if(!q)return t;return t.replace(new RegExp('('+q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','gi'),'<mark>$1</mark>');}

function ac(iid,did,dbk){
  const q=document.getElementById(iid).value.trim().toLowerCase();
  const sorted=[...DB[dbk]].sort((a,b)=>b.freq-a.freq);
  const filtered=q?sorted.filter(x=>x.text.toLowerCase().includes(q)):sorted.slice(0,10);
  const drop=document.getElementById(did);
  if(!filtered.length){drop.classList.remove('open');return;}
  drop.innerHTML=filtered.slice(0,9).map(item=>`<div class="ac-item" onmousedown="pickAC(event,'${iid}','${did}','${item.text.replace(/\\/g,'\\\\').replace(/'/g,"\\'")}')">
    <div style="flex:1"><div class="ac-text">${hl(item.text,q)}</div>${item.freq>0?`<div class="freq-bar" style="width:${Math.min(item.freq*15,100)}%"></div>`:''}</div>
    ${item.freq>0?`<span class="ac-meta">${item.freq}x</span>`:''}
  </div>`).join('');
  drop.classList.add('open');
}

function pickAC(e,iid,did,text){
  e.preventDefault();
  document.getElementById(did).classList.remove('open');
  const km={'f-issue':'issue'};

}

function getIssue(){const m=gv('f-issue').trim();return[...sel.issue,...(m&&!sel.issue.includes(m)?[m]:[])].join('; ');}
function getPrev(){return gv('f-prev').trim();}
function getToday(){return gv('f-today').trim();}

function buildTicket(){
  const sr=gv('f-sr').trim();
  const issue=getIssue();
  const repairs=gv('f-repairs').trim()||'0';
  const prev=getPrev();
  const today=getToday();
  if(!sr){toast('SR# is required','err');return;}
  if(!issue){toast('Issue is required','err');return;}
  const ml=cMethod==='phone'?'Phone first':'Email first';
  const s=`SR#${sr} / ${ml} / Issue: ${issue} / #of repairs: ${repairs} / What actions already been taken: ${prev||'N/A'} / Actions taken today: ${today||'N/A'} / ${getSIG()}`;
  document.getElementById('output').textContent=s;
  incFreq('issues',issue.split('; '));
  incFreq('actions',[...getToday().split('. '),...getPrev().split('; ')]);
  save();
  navigator.clipboard.writeText(s).catch(()=>{});
  toast('Ticket built & copied to clipboard');
}

function incFreq(dbk,texts){texts.forEach(t=>{const item=DB[dbk].find(x=>x.text===t.trim());if(item)item.freq++;});}

function archiveTicket(){
  buildTicket();
  const out=document.getElementById('output').textContent;
  if(out.startsWith('Fill'))return;
  DB.log.unshift({ts:new Date().toISOString(),sr:gv('f-sr').trim(),name:'',method:cMethod,issue:getIssue(),repairs:gv('f-repairs').trim()||'0',prev:getPrev(),today:getToday(),full:out});
  save();toast('Ticket archived');clearForm();updateKPIs();
}

function clearForm(){
  ['f-sr','f-issue','f-repairs','f-prev','f-today'].forEach(id=>{const el=document.getElementById(id);if(el)el.value='';});
  sel={issue:[]};
  renderChips('issue','chips-issue');
  // close all fcat panels
  document.querySelectorAll('.fcat-btns.open').forEach(p=>p.classList.remove('open'));
  document.querySelectorAll('.fcat-toggle.open').forEach(b=>b.classList.remove('open'));
  document.getElementById('output').textContent='Fill the fields on the left and click Build ticket.';
  setMethod('phone');
}

  snColor=el.dataset.color;
}

function loadNotes(){
  if(LIVE.notes&&LIVE.notes.length)return LIVE.notes;
  try{const r=localStorage.getItem('tt_notes');if(r)return JSON.parse(r);}catch(e){}
  return[];
}
function saveNotes(arr){
  LIVE.notes=arr;
  try{localStorage.setItem('tt_notes',JSON.stringify(arr));}catch(e){}
  markUnsaved();
}

function addStickyNote(){
  const inp=document.getElementById('sn-input');
  const text=inp?inp.value.trim():'';
  if(!text){toast('Write something first','err');return;}
  const notes=loadNotes();
  notes.unshift({id:'n'+Date.now(),text,color:snColor,ts:new Date().toISOString()});
  saveNotes(notes);
  inp.value='';
  renderStickyNotes();
  toast('Note saved');
}

function delNote(id){
  const notes=loadNotes().filter(n=>n.id!==id);
  saveNotes(notes);
  renderStickyNotes();
}

function editNote(id,newText){
  const notes=loadNotes();
  const n=notes.find(x=>x.id===id);
  if(n)n.text=newText;
  saveNotes(notes);
}

function renderStickyNotes(){
  const grid=document.getElementById('sn-grid');
  if(!grid)return;
  const notes=loadNotes();
  if(!notes.length){
    grid.innerHTML='<div class="sn-empty">No notes yet — add your first one above.</div>';
    return;
  }
  grid.innerHTML=notes.map(n=>{
    const c=SN_COLORS[n.color]||SN_COLORS.amber;
    const d=new Date(n.ts).toLocaleDateString([],{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'});
    return`<div class="sn-card" style="background:${c.bg};border:1px solid ${c.border}">
      <button class="sn-del" onclick="delNote('${n.id}')" title="Delete">×</button>
      <div class="sn-body" contenteditable="true" onblur="editNote('${n.id}',this.innerText.trim())">${n.text.replace(/</g,'&lt;').replace(/>/g,'&gt;')}</div>
      <div class="sn-meta">${d}</div>
    </div>`;
  }).join('');
}

// Allow Ctrl+Enter to add note quickly
document.addEventListener('keydown',function(e){
  if(e.ctrlKey&&e.key==='Enter'&&document.activeElement.id==='sn-input'){
    e.preventDefault();addStickyNote();
  }
});

// ── THEME TOGGLE ────────────────────────────────────────────────────────────
function applyTheme(mode){
  if(mode==='light'){
    document.body.classList.add('light');
    const icon=document.getElementById('theme-icon');
    const lbl=document.getElementById('theme-lbl');
    if(icon)icon.textContent='☀️';
    if(lbl)lbl.textContent='Light';
  } else {
    document.body.classList.remove('light');
    const icon=document.getElementById('theme-icon');
    const lbl=document.getElementById('theme-lbl');
    if(icon)icon.textContent='🌙';
    if(lbl)lbl.textContent='Dark';
  }
}

function toggleTheme(){
  const isLight=document.body.classList.contains('light');
  const newMode=isLight?'dark':'light';
  applyTheme(newMode);
  try{localStorage.setItem('tt_theme',newMode);}catch(e){}
}

// Apply saved theme on load
(function(){
  try{const t=localStorage.getItem('tt_theme');if(t)applyTheme(t);}catch(e){}
})();

document.addEventListener('keydown', function(e){
  const onNewTicket = document.getElementById('page-new').classList.contains('active');

  // Ctrl+Enter — Build ticket + auto-copy (works even inside textareas)
  if(e.ctrlKey && e.key==='Enter'){
    if(onNewTicket){ e.preventDefault(); buildTicket(); }
    return;
  }

  // Ctrl+Space — New ticket (clear form, navigate to new ticket page)
  if(e.ctrlKey && e.key===' '){
    e.preventDefault();
    const navBtn=document.getElementById('nav-new');
    if(navBtn && !onNewTicket){ nav('new', navBtn); }
    clearForm();
    setTimeout(()=>{ const sr=document.getElementById('f-sr'); if(sr)sr.focus(); },50);
    return;
  }
});
// ── MICROPHONE / SPEECH TO TEXT ───────────────────────────────────────────────
let micRecognition = null;
let micActive = false;
let micTargetId = null;
let micBtnId = null;
let micLblId = null;

function toggleMic(targetId, btnId, lblId){
  if(!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)){
    toast('Use Chrome or Edge for dictation','err');
    return;
  }
  // If already listening to the same field — stop
  if(micActive && micTargetId === targetId){ stopMic(false); return; }
  // If listening to a different field — stop that first silently
  if(micActive){ stopMic(true); }
  startMic(targetId, btnId, lblId);
}

function startMic(targetId, btnId, lblId){
  micTargetId = targetId;
  micBtnId = btnId;
  micLblId = lblId;

  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  micRecognition = new SR();
  micRecognition.continuous = true;
  micRecognition.interimResults = true;
  micRecognition.lang = 'en-CA';

  const btn = document.getElementById(btnId);
  const lbl = document.getElementById(lblId);
  const ta  = document.getElementById(targetId);
  if(btn) btn.classList.add('listening');
  if(lbl) lbl.textContent = 'Listening...';
  micActive = true;

  let baseText = ta ? ta.value.trimEnd() : '';
  if(baseText && !baseText.endsWith(',') && !baseText.endsWith('.'))
    baseText += ', ';

  micRecognition.onresult = function(event){
    let interim = '';
    let finalTxt = '';
    for(let i = event.resultIndex; i < event.results.length; i++){
      const t = event.results[i][0].transcript;
      if(event.results[i].isFinal) finalTxt += t;
      else interim += t;
    }
    if(finalTxt){
      baseText = ta.value.trimEnd();
      if(baseText && !baseText.endsWith(',') && !baseText.endsWith('.'))
        baseText += ', ';
      baseText += finalTxt.trim();
      ta.value = baseText;
    } else {
      ta.value = baseText + interim;
    }
    ta.scrollTop = ta.scrollHeight;
  };

  micRecognition.onerror = function(e){
    // no-speech is normal during pauses — do NOT stop or toast
    if(e.error === 'no-speech') return;
    if(e.error === 'aborted') return;
    toast('Mic: ' + e.error, 'err');
    stopMic(false);
  };

  micRecognition.onend = function(){
    // Auto-restart if still active (Chrome stops after silence)
    if(micActive && micRecognition){
      try{ micRecognition.start(); }catch(e){}
    }
  };

  try{ micRecognition.start(); }catch(e){ toast('Could not start mic','err'); micActive=false; }
}

function stopMic(silent){
  micActive = false;
  if(micRecognition){
    micRecognition.onend = null;
    micRecognition.onerror = null;
    try{ micRecognition.stop(); }catch(e){}
    micRecognition = null;
  }
  const btn = document.getElementById(micBtnId);
  const lbl = document.getElementById(micLblId);
  if(btn) btn.classList.remove('listening');
  if(lbl) lbl.textContent = 'Dictate';
  if(!silent) toast('Dictation saved');
  micTargetId = null; micBtnId = null; micLblId = null;
}



// ── AUTO-FIX TEXT ─────────────────────────────────────────────────────────────
const TYPO_MAP={
  // common typos
  'teh':'the','hte':'the','adn':'and','nad':'and','taht':'that','thta':'that',
  'waht':'what','amde':'made','mkae':'make','yuo':'you','yuor':'your',
  'hav':'have','jsut':'just','fo':'of','ot':'to','ti':'it','si':'is',
  'od':'do','fo':'of','ehr':'her','nad':'and','ont':'not','nto':'not',
  'woudl':'would','coudl':'could','shoudl':'should','colud':'could',
  'recieve':'receive','beleive':'believe','occured':'occurred','definately':'definitely',
  'seperate':'separate','truely':'truly','untill':'until','occurance':'occurrence',
  'wiht':'with','becuase':'because','becasue':'because','alot':'a lot',
  'alright':'all right','caleld':'called','aslo':'also','alsoo':'also',
  'agan':'again','agian':'again','thnaks':'thanks','tanksks':'thanks',
  'diagonstic':'diagnostic','diagnostics':'diagnostics','escalted':'escalated',
  'transfered':'transferred','recieved':'received','adviced':'advised',
  'confimred':'confirmed','confimed':'confirmed','informend':'informed',
  'memebr':'member','meber':'member','membr':'member','technican':'technician',
  'techincian':'technician','wararnty':'warranty','warrenty':'warranty',
  'replacment':'replacement','appointemnt':'appointment','appointement':'appointment',
  'folowup':'follow-up','follwoup':'follow-up','folloiw':'follow',
  'diagnose':'diagnose','diagnosid':'diagnosed','compleated':'completed',
  'completd':'completed','compelted':'completed','providied':'provided',
  'tranfered':'transferred','warmtransfer':'warm transfer',
  'ts':'ts','sr':'SR','oem':'OEM','pop':'POP','cat':'CAT',
};

function fixText(fieldId, btnId){
  const ta = document.getElementById(fieldId);
  if(!ta || !ta.value.trim()){ toast('Nothing to fix','err'); return; }

  let text = ta.value;

  // 1. Fix common typos (word by word, case-insensitive)
  text = text.replace(/\w+/g, word => {
    const lower = word.toLowerCase();
    if(TYPO_MAP[lower]){
      // preserve original casing style
      if(word[0] === word[0].toUpperCase() && word[0] !== word[0].toLowerCase())
        return TYPO_MAP[lower].charAt(0).toUpperCase() + TYPO_MAP[lower].slice(1);
      return TYPO_MAP[lower];
    }
    return word;
  });

  // 2. Fix double spaces
  text = text.replace(/ {2,}/g, ' ');

  // 3. Capitalize first letter of each sentence
  text = text.replace(/(^|[.!?]\s+)([a-z])/g, (m, p1, p2) => p1 + p2.toUpperCase());

  // 4. Capitalize "I" standalone
  text = text.replace(/ i /g, ' I ');
  text = text.replace(/^i /, 'I ');

  // 5. Fix missing space after comma
  text = text.replace(/,(?=[^\s])/g, ', ');

  // 6. Trim trailing/leading spaces per line
  text = text.split('
').map(l => l.trim()).join('
').trim();

  // 7. Capitalize SR, OEM, POP, CAT
  text = text.replace(/sr#/gi, 'SR#');
  text = text.replace(/oem/gi, 'OEM');
  text = text.replace(/pop/gi, 'POP');
  text = text.replace(/cat/gi, 'CAT');
  text = text.replace(/t2/gi, 'T2');

  ta.value = text;

  // Flash the button green briefly
  const btn = document.getElementById(btnId);
  if(btn){ btn.classList.add('done'); setTimeout(()=>btn.classList.remove('done'), 1500); }
  toast('Text fixed');
}
